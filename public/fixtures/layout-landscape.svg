<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Landscape Fixture</title>
  <desc id="desc">Local fixture for case-study layout prototyping.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a2f38"/>
      <stop offset="1" stop-color="#606a76"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect x="90" y="90" width="1420" height="820" fill="none" stroke="#f0ebe2" stroke-opacity="0.35"/>
  <text x="120" y="150" fill="#f0ebe2" font-size="44" font-family="Arial, sans-serif" letter-spacing="8">LANDSCAPE EVIDENCE</text>
  <text x="120" y="220" fill="#f0ebe2" fill-opacity="0.74" font-size="28" font-family="Arial, sans-serif">1600 x 1000 local fixture</text>
</svg>
