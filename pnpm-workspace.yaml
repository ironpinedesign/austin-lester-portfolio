allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true

# Narrow security resolutions for vulnerable transitive dependencies.
# Kept explicit so updates remain reviewable and the baseline stays reproducible.
overrides:
  'postcss@<8.5.23': 8.5.23
  'ws@>=8.0.0 <8.21.0': 8.21.0
  'undici@>=7.0.0 <7.29.0': 7.29.0
  'sharp@<0.35.0': 0.35.0
  'esbuild@<0.25.0': 0.25.12
  'esbuild@>=0.27.3 <0.28.1': 0.28.1
